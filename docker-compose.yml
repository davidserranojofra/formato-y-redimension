services:
  redimensiona:
    build: .
    container_name: redimensiona
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      PUERTO: "3000"
      TAMANIO_MAXIMO_MB: "20"
      CARPETA_SUBIDAS: "/tmp/uploads"
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
